name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          check-latest: false

      - name: Restore API
        run: dotnet restore src/InvestManage.Api/InvestManage.Api.csproj

      - name: Restore WPF
        run: dotnet restore src/InvestManage.Wpf/InvestManage.Wpf.csproj

      - name: Restore tests
        shell: pwsh
        run: |
          dotnet restore tests/InvestManage.Application.Tests/InvestManage.Application.Tests.csproj
          dotnet restore tests/InvestManage.Domain.Tests/InvestManage.Domain.Tests.csproj
          dotnet restore tests/InvestManage.Infrastructure.Tests/InvestManage.Infrastructure.Tests.csproj
          dotnet restore tests/InvestManage.Api.Tests/InvestManage.Api.Tests.csproj
          dotnet restore tests/InvestManage.Client.Tests/InvestManage.Client.Tests.csproj
          dotnet restore tests/InvestManage.Wpf.Tests/InvestManage.Wpf.Tests.csproj

      - name: Build API
        run: dotnet build src/InvestManage.Api/InvestManage.Api.csproj --configuration Release --no-restore

      - name: Build WPF
        run: dotnet build src/InvestManage.Wpf/InvestManage.Wpf.csproj --configuration Release --no-restore

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test tests/InvestManage.Application.Tests/InvestManage.Application.Tests.csproj --configuration Release --no-restore
          dotnet test tests/InvestManage.Domain.Tests/InvestManage.Domain.Tests.csproj --configuration Release --no-restore
          dotnet test tests/InvestManage.Infrastructure.Tests/InvestManage.Infrastructure.Tests.csproj --configuration Release --no-restore
          dotnet test tests/InvestManage.Api.Tests/InvestManage.Api.Tests.csproj --configuration Release --no-restore
          dotnet test tests/InvestManage.Client.Tests/InvestManage.Client.Tests.csproj --configuration Release --no-restore
          dotnet test tests/InvestManage.Wpf.Tests/InvestManage.Wpf.Tests.csproj --configuration Release --no-restore
